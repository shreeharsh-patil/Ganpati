name: Static site checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check regional-data.js
          node --check app.js
      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s regional-data.js
          test -s assets/ganpati-mark.svg
          test -s assets/hero-ganpati.svg
